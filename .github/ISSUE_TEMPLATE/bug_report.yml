name: Bug report
description: Report a reproducible failure without secrets.
title: '[Bug] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What failed and how can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Actual result and redacted evidence
      description: Include version, OS, execution mode and relevant logs. Never include tokens or confidential source.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
