name: Development release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run setup:runtime
      - run: npm run test:docker
      - name: Package exact source commit
        run: |
          git archive --format=tar.gz --prefix=CommCode/ --output=CommCode-source.tar.gz HEAD
          sha256sum CommCode-source.tar.gz > SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CommCode-source.tar.gz SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "CommCode $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
