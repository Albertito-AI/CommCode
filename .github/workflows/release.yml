name: Development release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run setup:runtime
      - run: npm run test:docker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - name: Package exact source commit
        run: |
          git archive --format=tar.gz --prefix=CommCode/ --output=CommCode-source.tar.gz HEAD
          sha256sum CommCode-source.tar.gz > SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" CommCode-source.tar.gz SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "CommCode $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
