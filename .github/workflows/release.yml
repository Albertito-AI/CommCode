name: Development release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate development release request
        id: request
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const req = JSON.parse(fs.readFileSync('.github/release-request.json'));
          if (!/^0\.\d+\.\d+-dev\.\d+$/.test(req.version) || req.version !== pkg.version) throw new Error('Development version mismatch');
          const tag = 'v' + req.version;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) throw new Error('Tag mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run setup:runtime
      - run: npm run test:docker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - name: Package exact source commit
        run: |
          git archive --format=tar.gz --prefix=CommCode/ --output=CommCode-source.tar.gz HEAD
          sha256sum CommCode-source.tar.gz > SHA256SUMS.txt
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: gh release create "$RELEASE_TAG" CommCode-source.tar.gz SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "CommCode $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
